function pick(t,i){
  const ok=i===t.ans;
  S.prog[t.id]={pick:i,ok};saveProg();updProg();showPick(t,i,true);renderSide();
}
function showPick(t,i,anim){
  const ok=i===t.ans;
  $$('#opts .opt').forEach((b,k)=>{b.classList.remove('ok','bad','sol');if(k===i)b.classList.add(ok?'ok':'bad');if(!ok&&k===t.ans)b.classList.add('sol');});
  $('#fb').innerHTML=ok?`<div class="fb ok">✅ Dobrze! Odpowiedź ${L[t.ans]}. Zobacz rozwiązanie, żeby sprawdzić tok rozumowania.</div>`:`<div class="fb bad">❌ Nie tym razem (wybrano ${L[i]}). Prawidłowa odpowiedź to <b>${L[t.ans]}</b>. Odsłoń rozwiązanie krok po kroku, żeby zobaczyć, gdzie mógł powstać błąd.</div>`;
}

function renderSol(t){
  let r;
  try{r=solveTask(t)}catch(e){$('#sol').innerHTML=warn('Nie można policzyć dla takich danych.');return}
  const n=r.steps.length,k=Math.min(S.rev[t.id]||0,n+1);
  const dflt=isDefault(t);
  let h=r.steps.slice(0,k).map((s,i)=>`<div class="step"><h4><i>${i+1}</i>${s.t}</h4><div class="bd">${s.b}</div></div>`).join('');
  if(k>n){
    let big,sub='';
    if(t.opts){
      if(dflt||t.vals===undefined){
        big=`Odpowiedź: ${L[r.idx]} – ${t.opts[r.idx].replace(/[;,.]$/,'')}`;
      }else{
        big=`Wynik: ${t.fmtV?t.fmtV(r.value):''} → najbliższa odpowiedź ${L[r.idx]}`;
        sub='<div class="tr">Zmieniono dane, więc wynik nie musi pasować do żadnej z odpowiedzi A–D.</div>';
      }
      if(r.valText)big+=`<div class="tr" style="font-weight:500">${r.valText}</div>`;
      if(t.vals&&isFinite(r.value)&&dflt)big+=`<div class="tr" style="font-weight:500">Obliczony wynik: ${t.fmtV(r.value)}</div>`;
    }else{
      big=`Cena jednej akcji Selekta ≈ ${t.fmtV(r.value)}`;
      if(r.extra)sub=`<div class="tr">${r.extra}</div>`;
    }
    h+=`<div class="finalbox"><div class="big">✔ ${big}</div>${sub}${t.trap?`<div class="tr">💡 <b>Pułapka / zapamiętaj:</b> ${t.trap}</div>`:''}${t.unsure?`<div class="tr">⚠️ Ta odpowiedź jest najbardziej prawdopodobna, ale nie mam oficjalnego klucza.</div>`:''}</div>`;
  }
  $('#sol').innerHTML=h;
  const nx=$('#next'),rs=$('#reset');
  nx.disabled=k>n;nx.textContent=k===0?'Pokaż pierwszy krok →':(k>=n?'Pokaż odpowiedź →':'Pokaż następny krok →');
  rs.disabled=k===0;
  $('#all').disabled=k>n;
  const info=k>0&&k<=n?`<div class="hint">Krok ${k} z ${n}</div>`:'';
  if(info)$('#sol').insertAdjacentHTML('beforeend',info);
  if(k>0&&k<=n+1){const last=$('#sol').lastElementChild;if(last&&k>0&&S._scroll){last.scrollIntoView({behavior:'smooth',block:'nearest'})}}
}

    $$('.tabsel button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===tbKey));
    let h='<tr><th>Okresy</th>'+Array.from({length:20},(_,i)=>`<th>${i+1}%</th>`).join('')+'</tr>';
    PER.forEach(n=>{h+=`<tr><td>${n}</td>`+Array.from({length:20},(_,i)=>{const r=(i+1)/100;let v=f(r,n);const big=v>=1000;const cls=tbHi&&tbHi.n===n&&tbHi.r===i+1?'hit':(tbHi&&(tbHi.n===n||tbHi.r===i+1)?'hc':'');return `<td class="${cls}" data-n="${n}" data-r="${i+1}">${fmt(v,4)}</td>`}).join('')+'</tr>'});
    $('#ftab').innerHTML=h;
    $$('#ftab td[data-n]').forEach(td=>td.onclick=()=>{tbHi={n:+td.dataset.n,r:+td.dataset.r};draw()});
    calc();
  };
  const calc=()=>{
    const k=$('#ck').value,r=parseFloat($('#cr').value.replace(',','.'))/100,n=parseFloat($('#cn').value);
    $('#cres').textContent=(isFinite(r)&&isFinite(n)&&r!==0)?`Czynnik = ${fmt(TB[k].f(r,n),4)}`:'—';
  };
  $$('.tabsel button').forEach(b=>b.onclick=()=>{tbKey=b.dataset.k;$('#ck').value=tbKey;draw()});
  ['ck','cr','cn'].forEach(id=>$('#'+id).oninput=calc);
  draw();
}

/* keyboard nav */
document.addEventListener('keydown',e=>{
  if(S.tab!=='tasks'||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const i=T.findIndex(t=>t.id===S.cur);
  if(e.key==='ArrowRight'&&i<T.length-1){S.cur=T[i+1].id;renderSide();renderTask()}
  if(e.key==='ArrowLeft'&&i>0){S.cur=T[i-1].id;renderSide();renderTask()}
  if(e.key===' '&&e.target===document.body){e.preventDefault();const b=$('#next');if(b&&!b.disabled)b.click()}
});
render();
</script>
